<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Storyboard design comparison</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#e8ebf1;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:#131722}
    h1{margin:0 0 18px;font-size:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #d7dbe4;border-radius:16px;padding:14px;box-shadow:0 10px 24px rgba(20,30,50,.08)}
    h2{margin:0 0 10px;font-size:16px}.bad{color:#8e2d25}.ref{color:#1554c5}img{display:block;width:100%;height:auto;border-radius:9px;border:1px solid #e2e4e9}
  </style>
</head>
<body>
  <h1>현재 Storyboard와 전달된 디자인 기준</h1>
  <div class="grid">
    <section class="card"><h2 class="bad">현재 결과</h2><img src="01-current-storyboard.png" alt="현재 Storyboard"></section>
    <section class="card"><h2 class="ref">디자인 기준</h2><img src="02-reference-design.png" alt="전달된 디자인 기준"></section>
  </div>
</body>
</html>
