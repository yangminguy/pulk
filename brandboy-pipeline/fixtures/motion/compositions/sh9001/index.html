<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      /* 전체 화면 클리핑 무대 — 레이어가 밖으로 나가도 캔버스 안에서 잘린다(캔버스 이탈 방지). */
      #stage { position: absolute; inset: 0; overflow: hidden; }
      #backdrop { position: absolute; inset: 0; background: transparent; }
      #bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
            background: linear-gradient(120deg, #0E1115, #2E6FB7); }
      #subject { position: absolute; left: 720px; top: 320px; width: 420px; height: 420px;
                 border-radius: 28px; background: #FFD84D; }
    </style>
  </head>
  <body>
    <!--
      sh9001 · 사진 parallax (photo_motion.type="parallax", asset_kind:"image").
      원본 스틸은 전경(피사체)/배경 레이어로 분리해 서로 다른 속도로 움직여 깊이감을 만든다(spec §6).
      결정론적 렌더를 위해 실제 이미지 로드 대신 합성 레이어로 대체했다 — 실제 저작물은 원본 스틸을
      레이어로 깐다. 캐시 키는 원본 스틸 파일 해시를 쓴다(브릿지 photoCacheKey).
      켄번즈(다운그레이드)는 여기가 아니라 T5 조립의 ffmpeg zoompan 소관이다.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="2" data-track-index="1">
        <!-- 경로 D: background 변수가 있으면 단색 배경을 칠한다. 경로 A(알파)에서는 변수 없음 → 투명. -->
        <div id="backdrop"></div>
        <div id="bg"></div>
        <div id="subject"></div>
      </div>
    </div>
    <script>
      try {
        const hf = window.__hyperframes;
        const vars = hf && hf.getVariables ? hf.getVariables() : {};
        if (vars && vars.background) document.getElementById("backdrop").style.background = vars.background;
      } catch (e) {}
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 느린 카메라 이동 + 레이어별 상이한 이동량 = parallax 깊이감. 등속(ease none).
      tl.fromTo("#bg", { xPercent: 0, scale: 1.0 }, { xPercent: -2, scale: 1.05, duration: 2, ease: "none" }, 0);
      tl.fromTo("#subject", { xPercent: 0, scale: 1.0 }, { xPercent: -8, scale: 1.12, duration: 2, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
