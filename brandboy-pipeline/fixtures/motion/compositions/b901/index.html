<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
    </style>
  </head>
  <body>
    <!--
      b901 · 의도적 파손 픽스처: 같은 트랙(1)에서 두 클립이 시간상 겹친다
      (a: 0–2s, b: 1–3s) → hyperframes lint "overlapping_clips_same_track" 오류.
      브릿지는 failed[] 로 보고해야 한다. fallback_text 자동 대체 금지(spec §5).
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div id="a" class="clip" data-start="0" data-duration="2" data-track-index="1"
           style="position: absolute; left: 200px; top: 400px; width: 200px; height: 200px; background: #FFD84D"></div>
      <div id="b" class="clip" data-start="1" data-duration="2" data-track-index="1"
           style="position: absolute; left: 600px; top: 400px; width: 200px; height: 200px; background: #B7F34A"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
