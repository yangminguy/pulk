<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      body { font-family: sans-serif; color: #FFFFFF; }
      .basin { position: absolute; border: 6px solid #FFFFFF; border-top: none; border-radius: 0 0 20px 20px; }
      .water { position: absolute; }
      .thr { position: absolute; border-radius: 4px; }
      .label { position: absolute; font-size: 40px; font-weight: 800; width: 260px; }
    </style>
  </head>
  <body>
    <!--
      b910 · type=accumulation · visual_statement:
      "저수지에 물이 차오르다 임계선을 넘어 살짝 흘러넘친다"
      움직임 자체가 논리다(spec §5). 수위(누적)가 임계선을 넘는 순간이 개념이다.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div id="basin" class="basin clip" data-start="0" data-duration="2" data-track-index="1"
           style="left: 760px; top: 340px; width: 400px; height: 420px"></div>
      <div id="water" class="water clip" data-start="0" data-duration="2" data-track-index="2"
           style="left: 766px; top: 346px; width: 388px; height: 408px; background: #B7F34A"></div>
      <div id="thr" class="thr clip" data-start="0" data-duration="2" data-track-index="3"
           style="left: 720px; top: 430px; width: 480px; height: 6px; background: #FFD84D"></div>
      <div id="lbl" class="label clip" data-start="0" data-duration="2" data-track-index="4"
           style="left: 1210px; top: 410px; color: #FFD84D">임계선</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      // 초기 변환은 gsap 이 소유한다(CSS transform 과 충돌 금지 — lint gsap_css_transform_conflict).
      gsap.set("#water", { transformOrigin: "bottom center", scaleY: 0.15 });
      const tl = gsap.timeline({ paused: true });
      // 물이 차오르다 1.2s 부근에서 임계선(top 430)을 넘어 살짝 흘러넘친다.
      tl.to("#water", { scaleY: 1.06, duration: 1.4, ease: "power1.inOut" }, 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
